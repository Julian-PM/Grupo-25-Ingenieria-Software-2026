<!DOCTYPE html>
<html lang="en">
<head>
  <title>Informe de Productos Pendientes de Despacho - Comercial D Nix</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css', v='2') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<script>

    function cargarTablas(){
        var test = document.querySelector('#inventario').value 
        const data = JSON.parse(test)
        var test2 = document.querySelector('#pedidos').value 
        const data2 = JSON.parse(test2)
        tablaInventario = 'tablaPendientesInventario'
        tablaPedidos = 'tablaPendientesPedidos'
        createTableFromJSON(data, tablaInventario);
        createTableFromJSON(data2, tablaPedidos);
    }

    function createTableFromJSON(data, tabla) {
        if (!data || !data.length) return;

        const table = document.createElement('table');
        table.className = "table table-striped";
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');
        const headerRow = document.createElement('tr');

        // Extract headers from the first object's keys
        const headers = Object.keys(data[0]);
        console.log(headers)
        headers.forEach(key => {
            const th = document.createElement('th');
            th.textContent = key;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // Create rows for each data object
        data.forEach((rowData) => {
            const tr = document.createElement('tr');
            headers.forEach(key => {
            const td = document.createElement('td');
            // Handle null/undefined or nested objects
            const value = rowData[key];
            td.textContent = (typeof value === 'object') ? JSON.stringify(value) : value;
            tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        document.getElementById(tabla).appendChild(table);
        } 
</script>

<body onload="cargarTablas()">
{% if  datosPedidos %}<input type="hidden"  id="pedidos" value='{{ datosPedidos | tojson}}'>{% endif %}
{% if datosInventario %}<input type="hidden"  id="inventario" value='{{ datosInventario | tojson}}'>{% endif %}
<div>
    <P>Productos en inventario presentes en pedidos pendientes</P>
    <div class="data-table-wrap" id="tablaPendientesInventario" onload="createTableFromJSON()"></div>
    {% if not datosInventario %}<div class="empty-state">Sin resultados todavía</div>{% endif %}
    <P>Pedidos pendientes con productos relevantes</P>
    <div class="data-table-wrap" id="tablaPendientesPedidos" onload="createTableFromJSON()"></div>
    {% if not datosPedidos %}<div class="empty-state">Sin resultados todavía</div>{% endif %}
</div>
</body>

</html>
