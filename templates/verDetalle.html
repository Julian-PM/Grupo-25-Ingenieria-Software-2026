<!DOCTYPE html>
<html lang="en">
<head>
  <title>Detalle de pedido - Comercial D Nix</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="foo" data-name="{{datos.data}}">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<script>

    function inicializarDetalle() {
        var test = document.querySelector('#my_variable').value 
        const data = JSON.parse(test)
        if (!data || !data.length) return;
        const idPedido = Object.values(data[0]);
        const idMostrar = document.createElement('p');
        idMostrar.textContent = "Viendo el pedido de ID: " + idPedido[2];
        document.getElementById('mostrarIDPedido').appendChild(idMostrar);

        const table = document.createElement('table');
        table.className = "table table-striped";
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');
        const headerRow = document.createElement('tr');

        // Extract headers from the first object's keys
        const headers = Object.keys(data[0]);
        //console.log(headers)
        headers.forEach(key => {
            const th = document.createElement('th');
            th.textContent = key;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // Create rows for each data object
        data.forEach((rowData) => {
            const tr = document.createElement('tr');
            headers.forEach(key => {
                const td = document.createElement('td');
                // Handle null/undefined or nested objects
                const value = rowData[key];
                td.textContent = (typeof value === 'object') ? JSON.stringify(value) : value;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        document.getElementById('tablaDetallePedido').appendChild(table);
        let subtotales = 0;
        let cantidades = [];
        let stock = [];
        let porcentajes = [];
        for (let i = 1; i < table.rows.length; i++) {
            const row = table.rows[i];
            if (row.cells.length > 0) {
                let celda = row.cells[0];
                celdaV = celda.innerHTML;
                celdaJ = JSON.parse(celdaV);
                const valor = Object.values(celdaJ)
                celdaF = valor[0];
                cantidades.push(celdaF);
            }
            if (row.cells.length > 7) {
                let celda = row.cells[7];
                celdaV = celda.innerHTML;
                celdaJ = JSON.parse(celdaV);
                const valor = Object.values(celdaJ)
                celdaF = valor[0];
                stock.push(celdaF);
            }
            if (row.cells.length > 8) {
                const cell = row.cells[8];
                if(cell){
                    subtotales += parseInt(cell.textContent.trim());
                }
            }
        const subtotalMostrar = document.createElement('p');
        subtotalMostrar.textContent = "Subtotal: " + subtotales;
        document.getElementById('mostrarIDPedido').appendChild(subtotalMostrar);
        for (let i = 0; i < table.rows.length; i++){
            if (stock[0] != 0) {
                porcentajes.push(100*cantidades[i] / stock[i]);
            }
            else {
                porcentajes.push(0);
            }
        }
        let suma = 0;
        for (let i = 0; i < porcentajes.length; i++){
            suma += porcentajes[i];
        }
        const porcentajeMostrar = document.createElement('p');
        porcentajeMostrar.textContent = "Porcentaje del pedido posible de cumplir según stock: " + (suma / porcentajes.length);
        document.getElementById('mostrarIDPedido').appendChild(porcentajeMostrar);
  }
    }

</script>

<body onload="inicializarDetalle()">
<input type="hidden"  id="my_variable" value='{{ datos | tojson }}'>


<div class="container-fluid" >
  
  <h1>Detalle de pedido</h1>
  <div id="mostrarIDPedido"></div>
  <!--Cada botón abrirá un modal-->

  <button type="button" class="btn btn-success" href="pedidos.html">Volver</button>
  <div class="container-fluid" id="tablaDetallePedido"></div>
  
</div>



</body>

</html>
