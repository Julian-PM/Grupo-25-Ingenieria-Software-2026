<!DOCTYPE html>
<html lang="en">
<head>
  <title>Análisis de pedidos y despachos mensuales - Comercial D Nix</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if datos %}<meta id="foo" data-name="{{datos.data}}">{% endif %}
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css', v='2') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<script>
    
    function cargarTablas(){
        var pedidosInicial = document.querySelector('#Pedidos').value
        var despachosInicial = document.querySelector('#Despachos').value 
        const pedidos = JSON.parse(pedidosInicial)
        const despachos = JSON.parse(despachosInicial)
        tablaPedidos = "pedidosTabla"
        tablaDespachos = "despachosTabla"
        createTableFromJSON(pedidos, tablaPedidos);
        createTableFromJSON(despachos, tablaDespachos);
    }

    function tablaProductosTerminados() {
        var test = document.querySelector('#my_variable').value 
        const data = JSON.parse(test)
        if (!data || !data.length) return;

        const table = document.createElement('table');
        table.className = "table table-striped";
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');
        const headerRow = document.createElement('tr');

        // Extract headers from the first object's keys
        const headers = Object.keys(data[0]);
        console.log(headers)
        headers.forEach(key => {
            const th = document.createElement('th');
            th.textContent = key;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // Create rows for each data object
        data.forEach((rowData) => {
            const tr = document.createElement('tr');
            headers.forEach(key => {
            const td = document.createElement('td');
            // Handle null/undefined or nested objects
            const value = rowData[key];
            td.textContent = (typeof value === 'object') ? JSON.stringify(value) : value;
            tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        document.getElementById('pedidosDespachos').appendChild(table);
        } 

    function createTableFromJSON(data, tabla) {
        if (!data || !data.length) return;

        const table = document.createElement('table');

        });
        thead.appendChild(headerRow);

        // Create rows for each data object
        data.forEach((rowData) => {
            const tr = document.createElement('tr');
            headers.forEach(key => {
            const td = document.createElement('td');
            // Handle null/undefined or nested objects
            const value = rowData[key];
            td.textContent = (typeof value === 'object') ? JSON.stringify(value) : value;
            tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        document.getElementById(tabla).appendChild(table);
        } 

    function tableTest(data) {
        if (!data || !data.length) return;

        const table = document.createElement('table');
        table.className = "table table-striped";
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');
        const headerRow = document.createElement('tr');

        // Extract headers from the first object's keys

            const value = rowData[key];

            tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        document.getElementById('pedidosDespachos').appendChild(table);
        } 
</script>

<body onload="cargarTablas()">
    <input type="hidden"  id="Pedidos" value='{{ pedidos | tojson }}'>
    <input type="hidden"  id="Despachos" value='{{ despachos | tojson }}'>
<div>
    <P>Análisis de pedidos y despachos por tiempo - Test</P>
    <form method="POST" role="form" action="#">
        <div class="mb-3 mt-3">
            <!--<label for="DesdeForm" class="form-label">Desde:</label>-->
            <label for="desdeFechaID" class="form-label">Desde:</label>
            <input type="date" class="form-control" id="desdeFechaID" placeholder="Pedidos y despachos desde..." name="desdeFecha">
        </div>
        <div class="mb-3 mt-3">
            <!--<label for="HastaForm" class="form-label">Hasta:</label>-->

            <input type="date" class="form-control" id="hastaFechaID" placeholder="Pedidos y despachos hasta..." name="hastaFecha">
        </div>
        <button type="submit" class="btn btn-primary">Buscar</button>

</div>
