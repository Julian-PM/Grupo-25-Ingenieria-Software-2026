<!DOCTYPE html>
<html lang="es">

<head>
  <title>Facturas - Comercial D Nix</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="foo" data-name="{{ datos.data }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<script>
      function createTableFromJSON() {
        var test = document.querySelector('#my_variable').value 
        const data = JSON.parse(test)
        if (!data || !data.length) return;

        const table = document.createElement('table');
        table.className = "table table-striped";
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');
        const headerRow = document.createElement('tr');

        // Extract headers from the first object's keys
        const headers = Object.keys(data[0]);
        console.log(headers)
        headers.forEach(key => {
            const th = document.createElement('th');
            th.textContent = key;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // Create rows for each data object
        data.forEach((rowData) => {
            const tr = document.createElement('tr');
            headers.forEach(key => {
            const td = document.createElement('td');
            // Handle null/undefined or nested objects
            const value = rowData[key];
            td.textContent = (typeof value === 'object') ? JSON.stringify(value) : value;
            tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        document.getElementById('tablaFacturas').appendChild(table);
        } 
</script>
<body>

<input type="hidden" id="my_variable" value='{{ datos | tojson }}'>

<div class="container-fluid mt-4">

  <h1>Facturas</h1>
  <p>Elija una opción.</p>

  <button type="button" class="btn btn-success"
          data-bs-toggle="modal" data-bs-target="#crearModal">
    Crear
  </button>

  <button type="button" class="btn btn-warning"
          data-bs-toggle="modal" data-bs-target="#actualizarModal">
    Actualizar
  </button>

  <button type="button" class="btn btn-danger"
          data-bs-toggle="modal" data-bs-target="#borrarModal">
    Borrar
  </button>

  <button type="button" class="btn btn-primary"
          onclick="createTableFromJSON()">
    Ver
  </button>

  <div class="container-fluid mt-3" id="tablaFacturas"></div>

</div>


<!-- CREAR FACTURA -->

<div class="modal fade" id="crearModal">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h4 class="modal-title">Crear Factura</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form method="POST" role="form" action="#">

          <input type="hidden" name="_method" value="post">

          <div class="mb-3">
            <label class="form-label">Número de Factura:</label>
            <input type="text" class="form-control"
                   id="numeroFacturaCrear"
                   name="numeroFacturaCrear"
                   placeholder="Ingrese número de factura">
          </div>

          <div class="mb-3">
            <label class="form-label">Fecha:</label>
            <input type="date" class="form-control"
                   id="fechaFacturaCrear"
                   name="fechaFacturaCrear">
          </div>

          <div class="mb-3">
            <label class="form-label">Razón Social / Cliente:</label>
            <input type="text" class="form-control"
                   id="razonSocialCrear"
                   name="razonSocialCrear"
                   placeholder="Ingrese razón social">
          </div>

          <div class="mb-3">
            <label class="form-label">RUT:</label>
            <input type="text" class="form-control"
                   id="rutCrear"
                   name="rutCrear"
                   placeholder="Ingrese RUT">
          </div>

          <div class="mb-3">
            <label class="form-label">Dirección:</label>
            <input type="text" class="form-control"
                   id="direccionCrear"
                   name="direccionCrear"
                   placeholder="Ingrese dirección">
          </div>

          <div class="mb-3">
            <label class="form-label">Giro:</label>
            <input type="text" class="form-control"
                   id="giroCrear"
                   name="giroCrear"
                   placeholder="Ingrese giro">
          </div>

          <div class="mb-3">
            <label class="form-label">Detalle:</label>
            <textarea class="form-control"
                      id="detalleCrear"
                      name="detalleCrear"
                      rows="4"
                      placeholder="Ingrese detalle de productos"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Forma de Pago:</label>

            <select class="form-select"
                    id="formaPagoCrear"
                    name="formaPagoCrear">

              <option value="">Seleccione una opción</option>
              <option value="Contado">Contado</option>
              <option value="Credito">Crédito</option>
              <option value="Transferencia">Transferencia</option>
              <option value="Otro">Otro</option>

            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Monto Neto:</label>
            <input type="number" class="form-control"
                   id="netoCrear"
                   name="netoCrear"
                   min="0">
          </div>

          <div class="mb-3">
            <label class="form-label">IVA:</label>
            <input type="number" class="form-control"
                   id="ivaCrear"
                   name="ivaCrear"
                   min="0">
          </div>

          <div class="mb-3">
            <label class="form-label">Total:</label>
            <input type="number" class="form-control"
                   id="totalCrear"
                   name="totalCrear"
                   min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">ID Cliente:</label>
            <input type="number" class="form-control"
                   id="idClienteCrear"
                   name="idClienteCrear"
                   min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">ID Pedido:</label>
            <input type="number" class="form-control"
                   id="idPedidoCrear"
                   name="idPedidoCrear"
                   min="0">
          </div>

          <button type="submit" class="btn btn-primary">
            Crear Factura
          </button>

        </form>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancelar
        </button>
      </div>

    </div>
  </div>
</div>


<!-- ACTUALIZAR FACTURA -->

<div class="modal fade" id="actualizarModal">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h4 class="modal-title">Actualizar Factura</h4>
        <button type="button" class="btn-close"
                data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form method="POST" role="form" action="#">

          <input type="hidden" name="_method" value="put">

          <div class="mb-3">
            <label class="form-label">ID de la Factura:</label>
            <input type="text" class="form-control"
                   id="idFacturaActualizar"
                   name="idFacturaActualizar"
                   placeholder="Ingrese ID">
          </div>

          <div class="mb-3">
            <label class="form-label">Número de Factura:</label>
            <input type="text" class="form-control"
                   id="numeroFacturaActualizar"
                   name="numeroFacturaActualizar">
          </div>

          <div class="mb-3">
            <label class="form-label">Fecha:</label>
            <input type="date" class="form-control"
                   id="fechaFacturaActualizar"
                   name="fechaFacturaActualizar">
          </div>

          <div class="mb-3">
            <label class="form-label">Razón Social / Cliente:</label>
            <input type="text" class="form-control"
                   id="razonSocialActualizar"
                   name="razonSocialActualizar">
          </div>

          <div class="mb-3">
            <label class="form-label">RUT:</label>
            <input type="text" class="form-control"
                   id="rutActualizar"
                   name="rutActualizar">
          </div>

          <div class="mb-3">
            <label class="form-label">Dirección:</label>
            <input type="text" class="form-control"
                   id="direccionActualizar"
                   name="direccionActualizar">
          </div>

          <div class="mb-3">
            <label class="form-label">Giro:</label>
            <input type="text" class="form-control"
                   id="giroActualizar"
                   name="giroActualizar">
          </div>

          <div class="mb-3">
            <label class="form-label">Detalle:</label>
            <textarea class="form-control"
                      id="detalleActualizar"
                      name="detalleActualizar"
                      rows="4"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Forma de Pago:</label>
            <input type="text" class="form-control"
                   id="formaPagoActualizar"
                   name="formaPagoActualizar">
          </div>

          <div class="mb-3">
            <label class="form-label">Monto Neto:</label>
            <input type="number" class="form-control"
                   id="netoActualizar"
                   name="netoActualizar"
                   min="0">
          </div>

          <div class="mb-3">
            <label class="form-label">IVA:</label>
            <input type="number" class="form-control"
                   id="ivaActualizar"
                   name="ivaActualizar"
                   min="0">
          </div>

          <div class="mb-3">
            <label class="form-label">Total:</label>
            <input type="number" class="form-control"
                   id="totalActualizar"
                   name="totalActualizar"
                   min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">ID Cliente:</label>
            <input type="number" class="form-control"
                   id="idClienteActualizar"
                   name="idClienteActualizar"
                   min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">ID Pedido:</label>
            <input type="number" class="form-control"
                   id="idPedidoActualizar"
                   name="idPedidoActualizar"
                   min="0">
          </div>
          <button type="submit" class="btn btn-primary">
            Actualizar Factura
          </button>

        </form>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancelar
        </button>
      </div>

    </div>
  </div>
</div>


<!-- BORRAR FACTURA -->

<div class="modal fade" id="borrarModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h4 class="modal-title">Borrar Factura</h4>
        <button type="button" class="btn-close"
                data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form method="POST" role="form" action="#">

          <input type="hidden" name="_method" value="delete">

          <div class="mb-3">
            <label class="form-label">ID de la Factura:</label>
            <input type="text" class="form-control"
                   id="idFacturaBorrar"
                   name="idFacturaBorrar"
                   placeholder="Ingrese ID de la factura">
          </div>

          <button type="submit" class="btn btn-danger">
            Borrar Factura
          </button>

        </form>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancelar
        </button>
      </div>

    </div>
  </div>
</div>


<script>

function createTableFromJSON() {

  const test = document.querySelector('#my_variable').value;
  const data = JSON.parse(test);

  if (!data || !data.length) return;

  const contenedor = document.getElementById('tablaFacturas');

  contenedor.innerHTML = "";

  const table = document.createElement('table');

  table.className =
    "table table-striped table-bordered";

  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');
  const headerRow = document.createElement('tr');

  const headers = Object.keys(data[0]);

  headers.forEach(key => {

    const th = document.createElement('th');

    th.textContent = key;

    headerRow.appendChild(th);

  });

  thead.appendChild(headerRow);

  data.forEach(rowData => {

    const tr = document.createElement('tr');

    headers.forEach(key => {

      const td = document.createElement('td');

      const value = rowData[key];

      td.textContent =
        (typeof value === 'object' && value !== null)
        ? JSON.stringify(value)
        : value ?? "";

      tr.appendChild(td);

    });

    tbody.appendChild(tr);

  });

  table.appendChild(thead);
  table.appendChild(tbody);

  contenedor.appendChild(table);
}

</script>

</body>
</html>
